<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Ký Số & Quản Lý Bài Giảng</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f7f6; color: #333; }
        h1 { color: #0066cc; text-align: center; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 45%; min-width: 320px; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .btn-blue { background-color: #007bff; }
        .btn-blue:hover { background-color: #0056b3; }
        input[type="file"], input[type="text"] { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; }
        pre { background: #222; color: #00ff00; padding: 10px; border-radius: 5px; overflow-x: auto; max-height: 200px; }
        ul { list-style-type: none; padding: 0; }
        li { background: #e9ecef; margin: 5px 0; padding: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <h1>Hệ Thống Ký Số & Quản Lý Bài Giảng</h1>
    <p style="text-align: center;">Tích hợp Chữ Ký Số RSA & Trợ Lý AI Agent Auto-Signing</p>

    <div class="container">
        <!-- Card 1: Upload -->
        <div class="card">
            <h3>📂 Tải Bài Giảng Mới (Tự Động Ký Số RSA)</h3>
            <form id="uploadForm">
                <input type="file" id="fileInput" required>
                <button type="submit">⬆ Upload & Ký Số Ngay</button>
            </form>
            <p id="uploadStatus" style="color: green; font-weight: bold; margin-top: 10px;"></p>
        </div>

        <!-- Card 2: JSON Data -->
        <div class="card">
            <h3>💻 Dữ Liệu JSON Danh Sách File</h3>
            <pre id="jsonOutput">[]</pre>
        </div>

        <!-- Card 3: Danh Sách File -->
        <div class="card" style="width: 93%;">
            <h3>📋 Danh Sách Bài Giảng & Tài Liệu 
                <button onclick="fetchFiles()" class="btn-blue" style="float: right;">🔄 Tải lại</button>
            </h3>
            <ul id="fileList">
                <li>Đang tải danh sách...</li>
            </ul>
        </div>
    </div>

    <script>
        // THAY ĐƯỜNG DẪN RENDER CỦA BẠN VÀO ĐÂY (không có dấu / ở cuối)
        const API_BASE_URL = "https://YOUR_RENDER_URL.onrender.com"; 

        // Hàm lấy danh sách file từ Backend
        async function fetchFiles() {
            try {
                const res = await fetch(`${API_BASE_URL}/files`);
                const data = await res.json();
                
                // Hiển thị JSON
                document.getElementById('jsonOutput').textContent = JSON.stringify(data, null, 2);

                // Hiển thị Danh sách UI
                const listEl = document.getElementById('fileList');
                listEl.innerHTML = '';

                if (!data || data.length === 0) {
                    listEl.innerHTML = '<li>Chưa có bài giảng nào trên hệ thống.</li>';
                    return;
                }

                data.forEach(item => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <span>📄 <b>${item.filename}</b> (${(item.size / 1024).toFixed(1)} KB)</span>
                        <a href="${API_BASE_URL}/files/${item.filename}" target="_blank">
                            <button class="btn-blue">Tải về / Xem</button>
                        </a>
                    `;
                    listEl.appendChild(li);
                });
            } catch (err) {
                console.error("Lỗi khi tải danh sách file:", err);
                document.getElementById('fileList').innerHTML = '<li style="color:red;">Không thể kết nối đến máy chủ Backend!</li>';
            }
        }

        // Xử lý Upload file
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files[0]) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            const statusEl = document.getElementById('uploadStatus');
            statusEl.innerText = "Đang tải lên và ký số...";

            try {
                const res = await fetch(`${API_BASE_URL}/upload`, {
                    method: 'POST',
                    body: formData
                });
                const result = await res.json();

                if (res.ok) {
                    statusEl.innerText = result.message;
                    fileInput.value = ''; // Reset ô chọn file
                    fetchFiles(); // TỰ ĐỘNG CẬP NHẬT LẠI DANH SÁCH FILE NGAY LẬP TỨC!
                } else {
                    statusEl.innerText = "Lỗi: " + (result.detail || "Không thể tải file lên.");
                }
            } catch (err) {
                console.error(err);
                statusEl.innerText = "Lỗi kết nối máy chủ!";
            }
        });

        // Tự động gọi tải danh sách lần đầu khi vừa mở trang
        window.onload = fetchFiles;
    </script>
</body>
</html>
